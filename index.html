                options: [

                    { text: "A magnetic tape backup cartridge used in mainframes", isCorrect: false, rationale: "This is tape storage." },
                    { text: "An optical disc read by infrared lasers for audio only", isCorrect: false, rationale: "This is incorrect." },
                    { text: "A cloud storage subscription service", isCorrect: false, rationale: "This is local physical optical media." }
                ]
            },
            {
                question: "What is an optical disc burner (optical writer)?",
                options: [
                    { text: "An optical drive equipped with a stronger laser capable of permanently altering dye layers or phase-change surfaces to write data onto CD-R, DVD-R, or Blu-ray discs", isCorrect: true, rationale: "Optical writers use higher-power lasers to burn data onto recordable or rewritable blank discs." },
                    { text: "A laser printer that fuses toner powder onto paper", isCorrect: false, rationale: "This describes laser printers." },
                    { text: "A device that scans paper documents into digital files", isCorrect: false, rationale: "This describes flatbed scanners." },
                    { text: "An incinerator for destroying confidential paper documents", isCorrect: false, rationale: "This is office waste management equipment." }
                ]
            },
            {
                question: "Why are optical discs still valued for long-term archival data storage despite the rise of cloud storage and SSDs?",
                options: [
                    { text: "Properly stored optical discs are immune to network hacking, ransomware, and mechanical hard drive crashes, retaining data safely for decades offline", isCorrect: true, rationale: "Offline optical archival discs cannot be infected by malware or hacked remotely over the internet." },
                    { text: "Because optical discs have infinite rewrite cycles", isCorrect: false, rationale: "Read-only discs cannot be rewritten." },
                    { text: "Because cloud storage has been made illegal worldwide", isCorrect: false, rationale: "Cloud storage is legal and popular." },
                    { text: "Because optical discs hold petabytes of data", isCorrect: false, rationale: "Their capacity is limited compared to modern cloud servers." }
                ]
            },
            {
                question: "Which summary best compares CD, DVD, and Blu-ray optical storage devices in IGCSE ICT?",
                options: [
                    { text: "CDs store up to 700 MB using infrared/red lasers; DVDs store 4.7+ GB using tighter red lasers; Blu-rays store 25+ GB using short-wavelength blue-violet lasers for high-definition media", isCorrect: true, rationale: "Capacities and laser wavelengths scale progressively from CD to DVD to Blu-ray due to increasing data density and finer laser focusing." },
                    { text: "All three optical formats share the exact same 500 GB storage capacity and use identical laser colors", isCorrect: false, rationale: "Their capacities and laser types differ completely." },
                    { text: "CDs are magnetic storage, DVDs are solid-state, and Blu-rays are optical tape", isCorrect: false, rationale: "All three are optical storage media." },
                    { text: "None of these devices are included in the IGCSE ICT syllabus", isCorrect: false, rationale: "CD, DVD, and Blu-ray are core syllabus optical storage topics." }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");
        const questionBox = document.getElementById("question-box");
        const optionsContainer = document.getElementById("options-container");
        const feedbackBox = document.getElementById("feedback-box");
        const nextBtn = document.getElementById("next-btn");
        const quizContainer = document.getElementById("quiz-container");
        const resultsContainer = document.getElementById("results-container");
        const finalScore = document.getElementById("final-score");

        function loadQuestion() {
            answered = false;
            feedbackBox.classList.add("hidden");
            nextBtn.classList.add("hidden");
            
            const q = questions[currentQuestionIndex];
            questionCounter.textContent = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            scoreDisplay.textContent = `Score: ${score}`;
            questionBox.textContent = q.question;

            // Shuffle options array randomly so correct answer is not always first
            let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

            optionsContainer.innerHTML = "";
            shuffledOptions.forEach((opt) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(opt, shuffledOptions);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedOpt, shuffledOptions) {
            if (answered) return;
            answered = true;

            const allOptionButtons = optionsContainer.children;

            shuffledOptions.forEach((opt, idx) => {
                allOptionButtons[idx].disabled = true;
                if (opt.isCorrect) {
                    allOptionButtons[idx].classList.add("correct");
                } else if (opt === selectedOpt && !selectedOpt.isCorrect) {
                    allOptionButtons[idx].classList.add("incorrect");
                }
            });

            feedbackBox.classList.remove("hidden");
            if (selectedOpt.isCorrect) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                feedbackBox.className = "feedback-box correct-feedback";
                feedbackBox.innerHTML = `<strong>Correct!</strong> ${selectedOpt.rationale}`;
            } else {
                feedbackBox.className = "feedback-box incorrect-feedback";
                feedbackBox.innerHTML = `<strong>Incorrect.</strong> ${selectedOpt.rationale}`;
            }

            if (currentQuestionIndex < questions.length - 1) {
                nextBtn.textContent = "Next Question";
            } else {
                nextBtn.textContent = "View Results";
            }
            nextBtn.classList.remove("hidden");
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                quizContainer.classList.add("hidden");
                resultsContainer.classList.remove("hidden");
                finalScore.textContent = `You scored ${score} out of ${questions.length}`;
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            resultsContainer.classList.add("hidden");
            quizContainer.classList.remove("hidden");
            loadQuestion();
        }

        // Initialize quiz on load
        loadQuestion();
    </script>
</body>
</html>
